name: Publish to Launchpad PPA

# Builds a signed Debian *source* package per Ubuntu series and uploads it to a
# Launchpad PPA. Launchpad then compiles the binaries on its build farm.
#
# Runs on the same v*.*.* release tags as release.yml, so every release also
# publishes to the PPA. The dput target is hardcoded to ppa:code-on-incus/ppa.
# The whole job no-ops unless the DEB_EMAIL variable is set, so forks/upstream
# without PPA credentials configured are not failed.
#
# Requirements (configure once in the GitHub repo settings):
#   Secrets:
#     GPG_PRIVATE_KEY  - ASCII-armored private key, passphrase-less (see docs/packaging-launchpad.md)
#     GPG_KEY_ID       - the key's fingerprint or long key id, used to sign
#   Variables:
#     DEB_EMAIL        - changelog Changed-By email (required; also the CI toggle)
#     DEB_FULLNAME     - changelog Changed-By name (optional, defaults to "Code on Incus")
#
# The signing key must have upload rights to ppa:code-on-incus/ppa. It does NOT
# need to match debian/changelog's Maintainer or DEB_EMAIL — Launchpad validates
# the signature, not those fields (see docs/packaging-launchpad.md). The PPA must have
# ppa:longsleep/golang-backports added as an archive dependency so its builders
# can resolve golang-1.25-go (see debian/README.source).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Upload source (${{ matrix.series.name }})
    # Skip entirely when unconfigured (e.g. forks without credentials).
    if: ${{ vars.DEB_EMAIL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with (a) the series longsleep/golang-backports publishes
        # golang-1.25-go for, and (b) series Launchpad still builds (non-EOL).
        # Interim (non-LTS) releases get 9 months of support: drop each past its
        # EOL (a dead series fails every release), add new interims once the Go
        # backport lands. EOL below = end of standard support.
        # `ver` is the numeric series version, used to build a version string
        # that sorts correctly across series (see the build step).
        series:
          - { name: jammy,    ver: '22.04' }  # LTS — EOL Apr 2027 (ESM to 2032)
          - { name: noble,    ver: '24.04' }  # LTS — EOL Apr 2029 (ESM to 2036)
          - { name: resolute, ver: '26.04' }  # LTS — EOL Apr 2031 (ESM to 2036)
        # Dropped once EOL: plucky (25.04, EOL Jan 2026),
        # questing (25.10, EOL Jul 2026).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags for the version

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'   # only for `go mod vendor`; Launchpad does the real build

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            devscripts debhelper dput dpkg-dev

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Vendor Go modules (offline-buildable source)
        run: go mod vendor

      - name: Build signed source package for ${{ matrix.series.name }}
        env:
          DEBEMAIL: ${{ vars.DEB_EMAIL }}
          DEBFULLNAME: ${{ vars.DEB_FULLNAME || 'Code on Incus' }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          BASE="$(dpkg-parsechangelog -SVersion | sed 's/[~-].*//')"
          # For a tag push, prefer the tag as the base version.
          case "${GITHUB_REF_NAME:-}" in v*) BASE="${GITHUB_REF_NAME#v}";; esac
          # ~ubuntuXX.YY.N, not ~<codename>N: codenames sort alphabetically and
          # Ubuntu restarts the alphabet (zesty -> artful), which would make the
          # next cycle's series look like a DOWNGRADE to apt and block the
          # upgrade after do-release-upgrade. The numeric form always sorts
          # forward. No Debian revision (`-1`): 3.0 (native) forbids a hyphen.
          VER="${BASE}~ubuntu${{ matrix.series.ver }}.1"
          dch -b -v "$VER" -D "${{ matrix.series.name }}" \
            "Automated PPA build of ${BASE} for ${{ matrix.series.name }}."
          # --no-lintian is a debuild option and must precede dpkg-buildpackage args.
          # -d skips the build-dep check: this is a source-only build (Launchpad
          # compiles), so golang-1.25-go/libsystemd-dev need not be installed here.
          debuild --no-lintian -S -sa -d -k"$GPG_KEY_ID"

      - name: Upload to PPA
        run: |
          set -euo pipefail
          # Upload exactly the source .changes the build step produced for this
          # series, rather than reconstructing the version (robust for manual runs).
          changes=$(ls ../code-on-incus_*~ubuntu${{ matrix.series.ver }}.1_source.changes)
          dput ppa:code-on-incus/ppa "$changes"
