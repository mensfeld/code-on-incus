name: macOS (Colima) smoke

# Reproduces issue #530 on a real macOS + Colima stack, where the workspace is a
# virtiofs mount owned by the macOS user (uid 501), not the container's code
# user (uid 1000). The Linux CI covers the raw.idmap code path (its runner uid
# is 1001 != 1000), but only Colima/Lima has the auto-detect + virtiofs behavior
# this issue is about — so this runs on every PR to guard the macOS path.
#
# macos-13 is Intel (Colima can use the `vz` hypervisor with nested virt);
# Apple-silicon GitHub runners do not permit nested virtualization.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

# A newer commit cancels an older queued/running macOS run for the same ref, so
# scarce macOS runners don't accumulate a backlog of stale jobs across pushes.
concurrency:
  group: macos-colima-${{ github.ref }}
  cancel-in-progress: true

jobs:
  colima-uid-mapping:
    name: "#530 UID mapping repro (Colima)"
    # macos-13-large is paid Intel (nested-virt capable, needed for Colima vz)
    # with better availability than free macos-13, which GitHub is retiring.
    # Apple-silicon runners cannot do nested virtualization, so Intel is required.
    runs-on: macos-13-large
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Colima + Lima
        run: |
          brew install colima lima
          colima version

      - name: Start Colima (vz + virtiofs, mounts $HOME writable)
        run: |
          # vz enables nested virt on Intel macOS; virtiofs mounts the macOS
          # $HOME (which contains the checkout) into the VM. The default VM user
          # maps to the host uid, so files under $HOME appear owned by that uid
          # inside the VM — exactly the #530 condition.
          colima start \
            --vm-type vz \
            --mount-type virtiofs \
            --mount "$HOME:w" \
            --cpu 3 --memory 6 --disk 30
          colima status
          echo "Host uid on macOS: $(id -u)"

      - name: Install Incus + Go inside the VM
        run: |
          colima ssh -- bash -eux <<'EOF'
          sudo apt-get update
          sudo apt-get install -y incus nftables golang-go curl
          sudo systemctl start incus || sudo systemctl start incus.socket || true
          sleep 5
          # Map the VM user's uid so raw.idmap can target it.
          echo "root:$(id -u):1" | sudo tee -a /etc/subuid
          echo "root:$(id -g):1" | sudo tee -a /etc/subgid
          sudo systemctl restart incus || true
          sleep 5
          cat <<PRESEED | sudo incus admin init --preseed
          networks:
          - name: incusbr0
            type: bridge
            config:
              ipv4.address: 10.47.63.1/24
              ipv4.nat: "true"
              ipv6.address: none
          storage_pools:
          - name: default
            driver: dir
          profiles:
          - name: default
            devices:
              eth0: {name: eth0, network: incusbr0, type: nic}
              root: {path: /, pool: default, type: disk}
          PRESEED
          incus version
          # The VM user needs incus access.
          sudo usermod -aG incus-admin "$USER" || sudo usermod -aG incus "$USER" || true
          EOF

      - name: Build coi inside the VM
        run: |
          colima ssh -- bash -eux <<EOF
          cd "${GITHUB_WORKSPACE}"
          mkdir -p internal/image/embedded internal/config/embedded
          cp profiles/default/config.toml internal/config/embedded/default_config.toml
          cp testdata/dummy/dummy internal/image/embedded/dummy
          sed -i 's/^swap = "true"/swap = ""/' internal/config/embedded/default_config.toml
          go build -o /tmp/coi ./cmd/coi
          /tmp/coi version
          EOF

      - name: Confirm Colima/virtiofs + uid mismatch, then reproduce #530
        run: |
          colima ssh -- bash -eux <<'EOF'
          # Sanity: this VM must look like Colima/Lima to coi, and its uid must
          # differ from the container code uid (1000) — the #530 preconditions.
          grep -q virtiofs /proc/mounts || { echo "no virtiofs mount — not a faithful repro"; exit 1; }
          test "$(id -u)" -ne 1000 || { echo "VM uid is 1000; no mismatch to test"; exit 1; }

          # Workspace on the virtiofs-mounted host $HOME, owned by the VM uid.
          WS="$HOME/coi-530-workspace"
          rm -rf "$WS"; mkdir -p "$WS"
          ls -ldn "$WS"

          sg incus-admin -c "/tmp/coi build" || /tmp/coi build

          # The reporter's exact failing command: write into the mounted workspace.
          /tmp/coi run --workspace "$WS" -- bash -c 'id -u > /workspace/uid.txt && echo mapped-write-ok > /workspace/marker.txt'

          # The write must have succeeded and be visible on the (virtiofs) host mount.
          test "$(cat "$WS/marker.txt")" = "mapped-write-ok"
          test "$(cat "$WS/uid.txt")" = "1000"
          echo "issue #530 repro passed: uid-mismatched virtiofs workspace is writable"
          EOF

      - name: Stop Colima
        if: always()
        run: colima stop || true
