name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build job gates all tests - nothing runs if build fails
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev

      - name: Prepare embedded build assets
        run: |
          mkdir -p internal/image/embedded
          mkdir -p internal/config/embedded
          cp profiles/default/config.toml internal/config/embedded/default_config.toml
          cp testdata/dummy/dummy internal/image/embedded/dummy
          # GitHub Actions runners lack the memory.swap cgroup controller.
          # Disable swap limit in the embedded default so tests can run.
          sed -i 's/^swap = "true"/swap = ""/' internal/config/embedded/default_config.toml

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=5m

      - name: Build
        run: go build -v ./...

      - name: Verify all test paths are assigned to a CI group
        run: python3 scripts/check-ci-coverage.py

  # Go unit tests run in parallel with integration tests (after build passes)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev

      - name: Prepare embedded build assets
        run: |
          mkdir -p internal/image/embedded
          mkdir -p internal/config/embedded
          cp profiles/default/config.toml internal/config/embedded/default_config.toml
          cp testdata/dummy/dummy internal/image/embedded/dummy
          # GitHub Actions runners lack the memory.swap cgroup controller.
          # Disable swap limit in the embedded default so tests can run.
          sed -i 's/^swap = "true"/swap = ""/' internal/config/embedded/default_config.toml

      - name: Run unit tests with coverage and race detector
        run: |
          # Run all tests except session package (immutable tests need CAP_LINUX_IMMUTABLE)
          go test -v -race -coverprofile=coverage-main.out -covermode=atomic $(go list ./... | grep -v /internal/session)

          # Build session test binary separately and grant CAP_LINUX_IMMUTABLE
          go test -c -race -cover -covermode=atomic -o /tmp/session.test ./internal/session/
          sudo setcap cap_linux_immutable=ep /tmp/session.test
          /tmp/session.test -test.v -test.coverprofile=coverage-session.out

          # Merge coverage profiles
          cat coverage-main.out > coverage.out
          tail -n +2 coverage-session.out >> coverage.out 2>/dev/null || true
          go tool cover -func=coverage.out | tail -1  # Show total coverage

  # Integration tests run in parallel with unit tests (after build passes)
  # Split into 15 test groups for parallel execution
  # Network isolation uses nftables (ip coi forward chain)
  integration:
    name: Integration Tests (${{ matrix.test_group.name }})
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test_group:
          - name: shell-ephemeral
            path: tests/shell/ephemeral
            description: "Ephemeral shell session tests"
          - name: shell-persistent
            path: tests/shell/persistent
            description: "Persistent shell session tests"
          - name: network
            path: tests/network
            description: "Network isolation tests"

          - name: no-sudoers
            path: tests/network/test_no_sudo_mode.py
            no_sudoers: true
            description: "Non-sudoers path (#508): [network] use_sudo=false, no passwordless nft sudo rule — restricted/allowlist fail clearly, open mode + health work"
          - name: container-file
            path: tests/container tests/file
            description: "Container and file operations"
          - name: core
            path: tests/list tests/attach tests/tmux tests/kill tests/persist
            description: "Core commands: list/attach/tmux/kill/persist"
          - name: core-build
            path: tests/build tests/run
            description: "Build and run command tests"
          - name: misc-cli
            path: tests/cli
            description: "CLI flag/format/output tests"
          - name: misc-snapshot
            path: tests/meta tests/snapshot tests/image
            description: "Snapshot, image, and meta command tests"
          - name: misc-commands
            path: tests/audit tests/clean tests/completion tests/docker tests/errors tests/help tests/info tests/mount tests/monitor tests/shutdown tests/update tests/version tests/main_help_flag.py tests/main_help_shorthand.py
            description: "Misc commands: audit/clean/completion/docker/errors/help/info/mount/monitor/shutdown/update/version + root help files"
          - name: misc-config
            path: tests/config tests/health tests/limits tests/schema
            description: "Config, health, limits, and schema tests"
          - name: monitoring-nft
            path: tests/integration/test_nft_monitoring.py
            description: "NFT network monitoring tests"
          - name: monitoring-threats
            path: tests/integration/test_security_monitoring.py
            pytest_args: "-k 'TestThreatDetection or TestEnvironmentScanningPatterns or TestReverseShellPatterns or TestNetworkThreats or TestPromptInjectionScenario'"
            description: "Threat detection tests"
          - name: monitoring-response
            path: tests/integration/test_security_monitoring.py
            pytest_args: "-k 'TestAutomatedResponse or TestHighLevelThreats or TestLargeWriteDetection or TestMonitoringConfiguration or TestMultipleThreats or TestAuditLogValidation or TestFalsePositives or TestThresholdBoundaries or TestConcurrentThreats'"
            description: "Response and threshold tests"
          - name: monitoring-advanced
            path: tests/integration/test_security_monitoring.py
            pytest_args: "-k 'TestExpandedEnvScanningPatterns or TestProcessHostProcWalk or TestForkBombDetection or TestProcessSpawnRateDetection or TestAuthLogWatcher or TestProcEventWatcher or TestCgroupInitPID'"
            description: "Host-side monitoring: env scan, process walk, fork bomb, spawn rate, auth log, proc events, cgroup init PID"
          - name: monitoring-network-detection
            path: tests/integration/test_network_connection_detection.py
            description: "Host-side /proc/<pid>/net TCP/UDP suspicious connection detection"
          - name: monitoring-log-inotify
            path: tests/integration/test_log_watcher_inotify.py
            description: "inotify-driven auth.log/syslog monitoring: syslog coverage, prompt delivery, log rotation"
          - name: monitoring-file-fanotify
            path: tests/integration/test_file_watcher_fanotify.py
            description: "fanotify sensitive file monitoring: shadow read, sudoers write, authorized_keys write"
          - name: uid-mapping
            path: tests/container/uid_mapping_shift_true.py tests/container/uid_mapping_raw_idmap.py
            description: "UID mapping integration tests"
          - name: git-hooks
            path: tests/git_hooks
            description: "Git hooks and security protection tests"
          - name: monitoring-db
            path: tests/integration/test_issue_505_resume_monitoring_panic.py tests/integration/test_gtfobins_db_pattern_detection.py tests/integration/test_gtfobins_db_absent_fallback.py tests/integration/test_sigma_db_detection.py
            description: "Monitoring detection-DB load paths (GTFOBins + Sigma), present and absent, incl. #505 regression"
          - name: terminal-pollution
            path: tests/integration/test_session_diagnostics_no_terminal_pollution.py
            description: "Session-runtime diagnostics must not leak onto the attached terminal (#372): nft debug + runtime-limit auto-stop"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install system dependencies
        env:
          NO_SUDOERS: ${{ matrix.test_group.no_sudoers }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev nftables

          # Set up NFT monitoring access for CI
          # Add runner to systemd-journal group for log access
          sudo usermod -aG systemd-journal $USER

          # The no-sudoers lane (#508) deliberately skips the passwordless-nft
          # sudoers rule the installer would add, to exercise the path where a
          # user declines it. (Note: GitHub runners still grant the runner
          # blanket sudo, so the use_sudo=false config flag — not the absence of
          # this file — is what actually drives the non-privileged behavior the
          # tests assert.)
          if [ "$NO_SUDOERS" = "true" ]; then
            echo "no-sudoers lane: skipping /etc/sudoers.d/coi-nft"
          else
            # Configure sudo NOPASSWD for nft commands
            echo "$USER ALL=(ALL) NOPASSWD: /usr/sbin/nft *" | sudo tee /etc/sudoers.d/coi-nft
            sudo chmod 0440 /etc/sudoers.d/coi-nft

            # Verify nft access
            sudo -n nft list ruleset || echo "NFT access configured"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/support/requirements.txt

      - name: Lint Python code with ruff
        run: |
          echo "Running ruff linter on Python test code..."
          ruff check tests/
          echo "Checking Python code formatting..."
          ruff format --check tests/

      - name: Enable swap (for future cgroup controller support)
        run: |
          # Activate swap so the memory.swap cgroup controller can work if
          # the kernel supports delegation (currently it doesn't on GHA runners,
          # so we also patch the embedded config to skip swap limits).
          if [ -f /swapfile ]; then
            sudo swapon /swapfile 2>/dev/null || true
          fi
          swapon --show || true

      - name: Install Incus and nftables
        run: |
          # Try Zabbly repo first (latest Incus), fall back to Ubuntu's native package
          sudo mkdir -p /etc/apt/keyrings/
          ZABBLY_SOURCES=/etc/apt/sources.list.d/zabbly-incus-stable.sources

          # Attempt to set up Zabbly repo
          if sudo curl -fsSL --connect-timeout 10 --retry 2 --retry-delay 5 https://pkgs.zabbly.com/key.asc -o /etc/apt/keyrings/zabbly.asc 2>/dev/null; then
            sudo sh -c "cat <<SOURCES > $ZABBLY_SOURCES
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/stable
          Suites: \$(. /etc/os-release && echo \${VERSION_CODENAME})
          Components: main
          Architectures: \$(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/zabbly.asc
          SOURCES"
            echo "Zabbly repo configured"
          else
            echo "WARNING: Zabbly repo unreachable"
          fi

          # nftables is pre-installed on Ubuntu 24.04 runners; install incus only
          # Install with fallback: try with Zabbly, if it fails remove Zabbly and use Ubuntu native
          sudo apt-get update
          if ! sudo apt-get install -y incus nftables; then
            echo "WARNING: Install failed, removing Zabbly repo and falling back to Ubuntu native Incus"
            sudo rm -f "$ZABBLY_SOURCES"
            sudo apt-get update
            sudo apt-get install -y incus nftables
          fi
          incus version || incus --version || true

          # Configure passwordless sudo for nft (masquerade is handled by Incus ipv4.nat=true)
          echo "$USER ALL=(ALL) NOPASSWD: /usr/sbin/nft *" | sudo tee /etc/sudoers.d/coi-nft-incus
          sudo chmod 0440 /etc/sudoers.d/coi-nft-incus
          sudo -n nft list ruleset || echo "nft access configured"
          echo "nftables ready for network isolation tests"

      - name: Initialize Incus
        run: |
          # Wait for Incus service to be ready
          sudo systemctl start incus.socket || true
          sleep 5

          # Configure subuid/subgid for UID mapping (needed for raw.idmap)
          # Map runner UID 1001 to be available for container remapping
          echo "root:1001:1" | sudo tee -a /etc/subuid
          echo "root:1001:1" | sudo tee -a /etc/subgid

          # Restart Incus to pick up subuid/subgid changes
          sudo systemctl restart incus || true
          sleep 5

          # Initialize Incus with btrfs storage and standard bridge networking
          cat <<EOF | sudo incus admin init --preseed
          config:
            images.compression_algorithm: none
          networks:
          - config:
              ipv4.address: 10.47.62.1/24
              ipv4.nat: "true"
              ipv6.address: none
            name: incusbr0
            type: bridge
          storage_pools:
          - config:
              size: 25GiB
            name: default
            driver: btrfs
          profiles:
          - config: {}
            devices:
              eth0:
                name: eth0
                network: incusbr0
                type: nic
              root:
                path: /
                pool: default
                type: disk
            name: default
          EOF

          # Allow access without re-login by changing socket permissions
          sudo chmod 666 /var/lib/incus/unix.socket

          # Add current user to incus-admin group
          sudo usermod -aG incus-admin $USER

          echo "Bridge network configured successfully"
          incus network list

      - name: Check kernel idmap support
        run: |
          echo "Kernel version:"
          uname -r
          echo "Checking for idmapped mount support:"
          grep -i idmap /proc/filesystems || echo "No idmap in /proc/filesystems"
          echo "Checking btrfs features:"
          sudo btrfs filesystem df /var/lib/incus/storage-pools/default || true
          echo "AppArmor status:"
          sudo aa-status | grep incus || echo "No incus AppArmor profiles"
          echo "Checking if AppArmor is blocking bind mounts:"
          sudo dmesg | grep -i "apparmor.*denied" | tail -20 || echo "No recent AppArmor denials"

      - name: Configure networking for Incus
        run: |
          # Enable IP forwarding (required for ALL container networking)
          echo 1 | sudo tee /proc/sys/net/ipv4/ip_forward > /dev/null
          echo 1 | sudo tee /proc/sys/net/ipv6/conf/all/forwarding > /dev/null

          # Set FORWARD chain policy to ACCEPT
          # This allows containers without explicit firewall rules to have full network access
          # COI's firewall rules use REJECT (not DROP) so they explicitly block traffic
          # regardless of the default policy
          sudo iptables -P FORWARD ACCEPT

          # Ensure NAT/masquerade is working for container internet access
          # Masquerade is handled by Incus (ipv4.nat=true), but add an explicit rule for reliability
          DEFAULT_IFACE=$(ip route | grep default | awk '{print $5}' | head -1)
          sudo iptables -t nat -A POSTROUTING -s 10.47.62.0/24 -o $DEFAULT_IFACE -j MASQUERADE

          echo "Network configuration complete"
          echo "FORWARD chain:"
          sudo iptables -L FORWARD -n --line-numbers | head -10
          echo "NAT POSTROUTING:"
          sudo iptables -t nat -L POSTROUTING -n

      - name: Restore base Ubuntu image from cache
        id: cache-ubuntu-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ubuntu-base-image.tar.gz
          key: ${{ runner.os }}-ubuntu-24.04-base-image

      - name: Import or download base Ubuntu image
        run: |
          # Import with alias coi-ubuntu-24.04 so EnsureLocalUbuntuImage finds it
          # without downloading 500 MB from Canonical's CDN on every CI run.
          if [ -f /tmp/ubuntu-base-image.tar.gz ]; then
            echo "Restoring Ubuntu 24.04 base image from cache..."
            incus image import /tmp/ubuntu-base-image.tar.gz --alias coi-ubuntu-24.04
          else
            echo "Downloading Ubuntu 24.04 base image from remote..."
            for attempt in 1 2 3; do
              if incus image copy images:ubuntu/24.04 local: --alias coi-ubuntu-24.04 --auto-update=false; then
                echo "Image downloaded on attempt $attempt"
                # Export for caching
                incus image export coi-ubuntu-24.04 /tmp/ubuntu-base-image
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "WARNING: Failed to download base image after 3 attempts"
              else
                echo "Download failed (attempt $attempt/3), retrying in 15s..."
                sleep 15
              fi
            done
          fi
          incus image list

      - name: Save base Ubuntu image to cache
        if: steps.cache-ubuntu-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ubuntu-base-image.tar.gz
          key: ${{ runner.os }}-ubuntu-24.04-base-image

      - name: Prepare embedded build assets
        run: |
          mkdir -p internal/image/embedded
          mkdir -p internal/config/embedded
          cp profiles/default/config.toml internal/config/embedded/default_config.toml
          cp testdata/dummy/dummy internal/image/embedded/dummy
          # GitHub Actions runners lack the memory.swap cgroup controller.
          # Disable swap limit in the embedded default so tests can run.
          sed -i 's/^swap = "true"/swap = ""/' internal/config/embedded/default_config.toml

      - name: Build COI binary
        run: |
          go build -o coi ./cmd/coi
          # Grant CAP_LINUX_IMMUTABLE for host-side immutable protection tests
          sudo setcap cap_linux_immutable=ep ./coi
          ./coi version

      - name: Configure COI for CI (use open network mode for builds)
        run: |
          # Use open mode by default so image builds can access internet
          # Tests will explicitly use restricted/allowlist modes when testing network isolation
          # Monitoring is NOT enabled globally - monitoring tests use their own enable_monitoring fixture
          mkdir -p ~/.coi
          cat > ~/.coi/config.toml << 'EOF'
          [network]
          mode = "open"
          EOF
          echo "Created COI config with network.mode = open"

      - name: Test bind mount functionality
        continue-on-error: true
        run: |
          # Skip if base image is not available (e.g., remote was unreachable and no cache)
          if ! incus image info coi-ubuntu-24.04 >/dev/null 2>&1; then
            echo "WARNING: coi-ubuntu-24.04 image not available, skipping bind mount test"
            exit 0
          fi

          echo "Testing if bind mounts work with shift=true..."

          # Create test directory and file
          mkdir -p /tmp/test-bind-mount
          echo "test-content" > /tmp/test-bind-mount/test-file.txt

          # Launch test container (use local alias to avoid external network dependency)
          incus launch coi-ubuntu-24.04 test-bind-mount-container
          sleep 5

          # Add bind mount with shift=true
          incus config device add test-bind-mount-container testmount disk source=/tmp/test-bind-mount path=/mnt/test shift=true

          # Check if file is visible inside container
          echo "Files in container /mnt/test:"
          incus exec test-bind-mount-container -- ls -la /mnt/test/

          # Try to read the file
          echo "Reading file from container:"
          incus exec test-bind-mount-container -- cat /mnt/test/test-file.txt || echo "FAILED: Cannot read file in container"

          # Try to create a file from inside container
          incus exec test-bind-mount-container -- sh -c 'echo "created-from-container" > /mnt/test/created.txt'

          # Check if file appears on host
          if [ -f /tmp/test-bind-mount/created.txt ]; then
            echo "SUCCESS: File created in container is visible on host"
            cat /tmp/test-bind-mount/created.txt
          else
            echo "FAILED: File created in container NOT visible on host"
            ls -la /tmp/test-bind-mount/
          fi

          # Cleanup
          incus delete test-bind-mount-container --force
          rm -rf /tmp/test-bind-mount

      - name: Restore COI image from cache
        id: cache-coi-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/coi-image.tar.gz
          key: ${{ runner.os }}-coi-image-${{ hashFiles('internal/image/**', 'testdata/dummy/**', 'profiles/default/**') }}

      - name: Import COI image from cache
        if: steps.cache-coi-image.outputs.cache-hit == 'true'
        run: |
          echo "Restoring COI image from cache..."
          incus image import /tmp/coi-image.tar.gz --alias coi-default
          ./coi image list

      - name: Build COI image
        if: steps.cache-coi-image.outputs.cache-hit != 'true'
        run: |
          echo "Building COI image (not cached)..."
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3..."
            if ./coi build; then
              echo "Image built successfully on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to build COI image after 3 attempts"
              exit 1
            fi
            echo "Build failed, retrying in 10s..."
            sleep 10
          done
          ./coi image list
          # Export image for caching
          incus image export coi-default /tmp/coi-image

      - name: Save COI image to cache
        if: steps.cache-coi-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/coi-image.tar.gz
          key: ${{ runner.os }}-coi-image-${{ hashFiles('internal/image/**', 'testdata/dummy/**', 'profiles/default/**') }}

      - name: Free disk space for image-intensive tests
        if: matrix.test_group.name == 'core-build'
        run: |
          # core-build publishes many full images; free up space to avoid "no space left on device"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Debug iptables/nft state before tests
        run: |
          echo "=== FORWARD chain policy and rules ==="
          sudo iptables -L FORWARD -n -v --line-numbers
          echo ""
          echo "=== nft coi table (if it exists) ==="
          sudo nft list table ip coi 2>/dev/null || echo "(ip coi table not yet created)"
          echo ""
          echo "=== NAT table ==="
          sudo iptables -t nat -L -n -v | head -30

      - name: Run ${{ matrix.test_group.name }} tests with coverage
        run: |
          echo "============================================"
          echo "Running: ${{ matrix.test_group.description }}"
          echo "Path: ${{ matrix.test_group.path }}"
          echo "Args: ${{ matrix.test_group.pytest_args }}"
          echo "============================================"

          # Run test group with coverage reporting
          # pytest_args allows filtering specific test classes within a file
          python -m pytest ${{ matrix.test_group.path }} ${{ matrix.test_group.pytest_args }} -v --tb=short --durations=0 --cov=tests --cov-report=term-missing
        env:
          COI_BINARY: ./coi
          GITHUB_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}

      - name: Cleanup
        if: always()
        run: |
          ./coi kill --all --force || true
          ./coi clean --force || true

  # COI inside a Lima VM (issue #543): runner -> Lima/QEMU-KVM Ubuntu guest with a
  # virtiofs $HOME mount -> Incus -> COI containers. This is the only lane where
  # isColimaOrLimaEnvironment() is genuinely TRUE (it keys on virtiofs in
  # /proc/mounts), reproducing the macOS Colima/Lima environment class (#530,
  # #534, #221, #45) that hosted macOS runners cannot cover (Colima needs Intel
  # nested virt; GitHub retired those runners). Most test workspaces live on the
  # guest's native fs (pytest tmp_path -> /tmp); the #534 regression test
  # deliberately puts its workspace ON the virtiofs mount to prove the
  # isolation fallback covers idmap-incompatible device filesystems.
  lima-smoke:
    name: Lima Smoke (COI inside a Lima VM, virtiofs)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install host packages (QEMU + virtiofsd + build deps)
        run: |
          sudo apt-get update
          # qemu-system-x86 + qemu-utils: Lima's qemu driver; virtiofsd: the Rust
          # vhost-user daemon Lima discovers via /usr/share/qemu/vhost-user/*.json
          # (Lima does NOT search PATH for it); libsystemd-dev: cgo build (sdjournal).
          sudo apt-get install -y libsystemd-dev qemu-system-x86 qemu-utils virtiofsd

      - name: Enable KVM (fail fast if unavailable)
        run: |
          # Standard GitHub pattern for /dev/kvm access on Linux runners.
          # udev applies the rule ASYNCHRONOUSLY: without settle + retry the
          # permission check races the mode change (observed: identical code
          # passed twice, then failed on the third run purely on timing).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15 || true
          for i in 1 2 3 4 5; do
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then break; fi
            sleep 2
          done
          # Node exists but perms still not applied -> set them directly (the
          # udev rule stays in place for any future node re-creation).
          if [ -e /dev/kvm ] && { [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; }; then
            sudo chmod 666 /dev/kvm
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "FATAL: /dev/kvm not usable — this lane must not run under TCG emulation"
            ls -l /dev/kvm 2>&1 || echo "(no /dev/kvm node at all)"
            lsmod | grep -i kvm || echo "(no kvm modules loaded)"
            grep -m1 -oE 'vmx|svm' /proc/cpuinfo || echo "(no virt extensions in cpuinfo)"
            exit 1
          fi
          ls -l /dev/kvm
          # Rust virtiofsd sandboxes itself via unprivileged user namespaces;
          # make sure noble's restriction cannot block it (cheap insurance).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          df -h /

      - name: Prepare embedded build assets
        run: |
          mkdir -p internal/image/embedded
          mkdir -p internal/config/embedded
          cp profiles/default/config.toml internal/config/embedded/default_config.toml
          cp testdata/dummy/dummy internal/image/embedded/dummy
          # GitHub Actions runners lack the memory.swap cgroup controller.
          # Disable swap limit in the embedded default so tests can run.
          sed -i 's/^swap = "true"/swap = ""/' internal/config/embedded/default_config.toml

      - name: Build COI binary (on the runner; go.mod needs Go 1.25)
        run: |
          # The guest is the same distro/arch (Ubuntu 24.04 amd64), so the binary
          # runs there as-is. setcap happens in the guest on a native-fs copy —
          # xattrs on the virtiofs mount are unreliable.
          go build -o coi ./cmd/coi
          ./coi version

      - name: Install Lima
        run: |
          LIMA_VERSION=2.1.4
          curl -fsSL --retry 3 "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-x86_64.tar.gz" -o /tmp/lima.tar.gz
          echo "78da175634c38beab62a6618d16b9c7aeeabdbb5d99ed5c9a03bac212c786bfa  /tmp/lima.tar.gz" | sha256sum -c
          sudo tar -C /usr/local -xzf /tmp/lima.tar.gz
          limactl --version

      - name: Cache Lima guest image downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lima
          key: ${{ runner.os }}-lima-guest-${{ hashFiles('scripts/lima-coi.yaml') }}

      - name: Restore COI image from cache (restore-only; core-build owns saves)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/coi-image.tar.gz
          key: ${{ runner.os }}-coi-image-${{ hashFiles('internal/image/**', 'testdata/dummy/**', 'profiles/default/**') }}

      - name: Restore base Ubuntu image from cache (restore-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ubuntu-base-image.tar.gz
          key: ${{ runner.os }}-ubuntu-24.04-base-image

      - name: Stage image tarballs under $HOME (the guest sees only the ~ mount, not /tmp)
        run: |
          cp /tmp/coi-image.tar.gz "$HOME/" 2>/dev/null || echo "no cached coi image (will build inside the guest)"
          cp /tmp/ubuntu-base-image.tar.gz "$HOME/" 2>/dev/null || echo "no cached base image (smoke tests don't need it)"

      - name: Start the Lima VM (retry x3, refuse TCG fallback)
        run: |
          started=0
          for attempt in 1 2 3; do
            echo "limactl start attempt $attempt/3"
            if timeout 600 limactl start --name=coi --tty=false "$GITHUB_WORKSPACE/scripts/lima-coi.yaml"; then
              started=1
              break
            fi
            limactl stop -f coi 2>/dev/null || true
            limactl delete -f coi 2>/dev/null || true
            sleep 10
          done
          if [ "$started" != 1 ]; then
            echo "FATAL: lima failed to start after 3 attempts"
            exit 1
          fi
          limactl list
          # Lima v2 silently falls back to TCG when KVM is unusable — refuse that:
          # a TCG run would blow the time budget and mask perf-class regressions.
          if ! pgrep -af qemu-system-x86_64 | grep -Eq 'accel[ =]kvm|-enable-kvm'; then
            echo "FATAL: QEMU is running WITHOUT KVM acceleration (TCG fallback):"
            pgrep -af qemu-system-x86_64 || true
            exit 1
          fi

      - name: Provision the guest (incus, deps, coi binary, image import-or-build)
        # timeout-wrapped: if the guest dies mid-provision (first run: host memory
        # exhaustion killed the VM during `incus publish`), the dead SSH session
        # otherwise lingers ~20+ min on TCP timeouts before exiting 255.
        run: |
          timeout 2400 limactl shell --workdir "$GITHUB_WORKSPACE" coi -- bash "$GITHUB_WORKSPACE/scripts/lima-guest-setup.sh" \
            "$GITHUB_WORKSPACE" "$HOME/coi-image.tar.gz" "$HOME/ubuntu-base-image.tar.gz"

      - name: Run smoke tests inside the Lima guest
        run: |
          # Single-quoted body: $HOME resolves in the GUEST (/home/<user>.guest,
          # native fs) where the venv lives. cwd is the virtiofs-mounted checkout.
          # COI_TEST_VIRTIOFS_DIR is quote-spliced from the HOST shell: the host
          # $HOME is the virtiofs mount inside the guest — the #534 regression
          # test creates its workspace there.
          # No --cov: it measures test code only (all native lanes already emit it)
          # and coverage's SQLite file on virtiofs is a needless flake surface.
          limactl shell --workdir "$GITHUB_WORKSPACE" coi -- bash -c '
            set -euo pipefail
            export COI_BINARY=/usr/local/bin/coi
            export COI_TEST_VIRTIOFS_DIR="'"$HOME"'"
            exec "$HOME/venv/bin/python" -m pytest \
              tests/run/test_uid_mapping.py tests/run/test_run_script.py tests/run/test_virtiofs_workspace.py \
              -v --tb=short --durations=0
          '

      - name: Diagnostics (on failure)
        if: failure()
        # Every limactl invocation is timeout-wrapped: if the guest/SSH is the
        # thing that broke, an unguarded `limactl shell` hangs this step until
        # the job timeout (observed on the first run) instead of surfacing logs.
        run: |
          set +e
          echo "=== host ==="
          df -h; free -m
          echo "--- host dmesg tail (OOM kills of qemu land here) ---"
          sudo dmesg | tail -n 30
          timeout 30 limactl list
          echo "--- hostagent stderr (virtiofsd/QEMU spawn failures land here) ---"
          tail -n 100 "$HOME/.lima/coi/ha.stderr.log" 2>/dev/null
          echo "--- guest serial console tail (guest kernel oops/OOM land here) ---"
          tail -n 80 "$HOME"/.lima/coi/serial*.log 2>/dev/null
          echo "=== guest ==="
          timeout 90 limactl shell coi -- bash -c '
            grep virtiofs /proc/mounts; id
            timeout 15 incus list 2>&1
            timeout 15 incus warning list 2>&1 | head -20
            sudo journalctl -u incus -n 100 --no-pager 2>&1 | tail -n 60
            sudo dmesg | tail -n 40
            df -h /; free -m
          ' 2>&1 | head -n 200
          echo "=== diagnostics done ==="

      - name: Stop the VM
        if: always()
        run: timeout 60 limactl stop -f coi 2>/dev/null || true

  # End-to-end regression guard for #666 on a REAL non-apt distro. The stubbed Go
  # tests (Unit lane) source install.sh with a hand-set PKG_MANAGER and mocked
  # binaries; this runs the actual storage-selection logic inside a genuine Arch
  # container where `pacman` and `command -v zfs` resolve for real, proving the
  # installer never auto-installs ZFS on Arch (which breaks the initramfs) and
  # selects btrfs instead. incus/sudo are intercepted by a recording shim — we
  # must never actually run `pacman -S zfs*`, and there is no incus daemon here.
  installer-storage-arch:
    name: Installer Storage E2E (Arch, #666)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    container:
      image: archlinux:latest
    steps:
      - name: Install git (for checkout) and coreutils
        run: pacman -Sy --noconfirm --needed git grep sed coreutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ZFS gate — btrfs absent (installer must reach for btrfs-progs, never zfs)
        run: bash tests/installer/zfs_gate_arch_e2e.sh

      - name: ZFS gate — btrfs already present (reporter's case, no install at all)
        env:
          COI_E2E_BTRFS_PRESENT: "1"
        run: bash tests/installer/zfs_gate_arch_e2e.sh

  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - build
      - unit-tests
      - integration
      - lima-smoke
      - installer-storage-arch
    steps:
      - name: Check all jobs passed
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI checks passed!"
